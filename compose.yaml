name: learning-bot-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_platform -d agent_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    command: ["sh", "-c", "alembic upgrade head && uvicorn platform_api.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    environment: &platform-environment
      PLATFORM_ENV: staging
      DATABASE_URL: postgresql+psycopg://agent_platform:${POSTGRES_PASSWORD:-local-postgres-password}@postgres:5432/agent_platform
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-compose-only-secret-change-before-deploying}
      AUTO_CREATE_SCHEMA: "false"
      EMBEDDED_WORKER: "false"
      ALLOWED_ORIGINS: http://localhost:8080
      OBJECT_STORE_PATH: /app/platform_data/objects
      PLATFORM_VECTOR_ROOT: /app/platform_data/vectors
    volumes:
      - platform_data:/app/platform_data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "platform_api.worker"]
    env_file: .env
    environment: *platform-environment
    volumes:
      - platform_data:/app/platform_data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  platform_data:
